<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaMart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="top-utility-bar">
        <div>Welcome to worldwide Megamart!</div>
        <div class="right-options">
            <a href="#"><span class="icon-blue">📍</span> Deliver to <span class="zip-code">423651</span></a>
            <span class="separator">|</span>
            <a href="#"><span class="icon-blue">🚚</span> Track your order</a>
            <span class="separator">|</span>
            <a href="#"><span class="icon-blue">🏷️</span> All Offers</a>
        </div>
    </div>

    <header class="main-header">
        <div class="brand-area">
            <div class="menu-toggle">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            <span class="logo">MegaMart</span>
        </div>

        <div class="search-bar-container">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search essentials, groceries and more...">
        </div>

        <div class="user-actions">
            <a href="#" class="user-link"><span class="icon-blue">👤</span> Sign Up/Sign In</a>
            <span class="vertical-line">|</span>
            <a href="#" class="cart-link"><span class="icon-blue">🛒</span> Cart</a>
        </div>
    </header>

    <nav class="categories-nav">
        <a href="#" class="cat-btn active">Groceries <span class="arrow">∨</span></a>
        <a href="#" class="cat-btn">Premium Fruits <span class="arrow">∨</span></a>
        <a href="#" class="cat-btn">Home & Kitchen <span class="arrow">∨</span></a>
        <a href="#" class="cat-btn">Fashion <span class="arrow">∨</span></a>
        <a href="#" class="cat-btn">Electronics <span class="arrow">∨</span></a>
        <a href="#" class="cat-btn">Beauty <span class="arrow">∨</span></a>
        <a href="#" class="cat-btn">Home Improvement <span class="arrow">∨</span></a>
        <a href="#" class="cat-btn">Sports, Toys & Luggage <span class="arrow">∨</span></a>
    </nav>

</body>
</html>
